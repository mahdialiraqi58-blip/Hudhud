<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدهد - المنصة التعليمية الذكية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link id="dynamicAppleIcon" rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3750/3750079.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

:root {
  --bg: #f4f7fb; --surface: rgba(255, 255, 255, 0.88); --surface-solid: #ffffff;
  --ink: #0f172a; --muted: #64748b; --accent: #4f46e5; --accent-hover: #4338ca;
  --accent-ink: #ffffff; --tint: #e0e7ff; --line: rgba(15, 23, 42, 0.08);
  --danger: #ef4444; --success: #10b981; --warn: #f59e0b; --star: #fbbf24;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04); --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.16); --radius: 22px;
  --base-font: 16px;
}
[data-theme="dark"] {
  --bg: #070d19; --surface: rgba(17, 26, 46, 0.86); --surface-solid: #111a2e;
  --ink: #f8fafc; --muted: #94a3b8; --accent: #818cf8; --accent-hover: #6366f1;
  --accent-ink: #070d19; --tint: rgba(129, 140, 248, 0.16); --line: rgba(248, 250, 252, 0.09);
  --danger: #f87171; --success: #34d399; --warn: #fbbf24; --star: #fbbf24;
}
[data-theme="comfort"] {
  --bg: #f5efe4; --surface: rgba(252, 248, 240, 0.92); --surface-solid: #fcf8f0;
  --ink: #2c241b; --muted: #6e5f4f; --accent: #b45309; --accent-hover: #92400e;
  --accent-ink: #ffffff; --tint: rgba(180, 83, 9, 0.14); --line: rgba(44, 36, 27, 0.10);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: var(--base-font); }
html, body { margin: 0; min-height: 100%; scroll-behavior: smooth; }
body {
  background-color: var(--bg); color: var(--ink);
  font: 1rem/1.65 "IBM Plex Sans Arabic", system-ui, sans-serif;
  background-image: radial-gradient(circle at 12% 0%, var(--tint), transparent 38%), radial-gradient(circle at 90% 10%, rgba(139, 92, 246, 0.10), transparent 35%);
  -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
  touch-action: manipulation;
}
body.viewing, body.sheet-open { overflow: hidden; }

#scrollProgressBar {
  position: fixed; top: 0; right: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  z-index: 9998; transition: width 0.1s ease-out;
}

.smart-banner {
  position: sticky; top: 0; z-index: 90; padding: 9px 16px;
  font-size: 13px; font-weight: 700; text-align: center;
  display: none; align-items: center; justify-content: center; gap: 10px;
  backdrop-filter: blur(12px);
}
.smart-banner.offline { background: rgba(239, 68, 68, 0.92); color: #fff; display: flex; }
.smart-banner.online-back { background: rgba(16, 185, 129, 0.94); color: #fff; display: flex; }

#preloader { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
.preloader-icon { display: inline-flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(145deg, #1e1b4b, #312e81); box-shadow: var(--shadow-lg); animation: fly 1.5s infinite ease-in-out; }
@keyframes fly { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(6deg); } 100% { transform: translateY(0) rotate(0deg); } }
#preloader.hidden { opacity: 0; pointer-events: none; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 20px 95px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 24px; padding: 12px 18px; box-shadow: var(--shadow-sm); }
.logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 17px; background: linear-gradient(145deg, #1e1b4b, #312e81); border: 1px solid rgba(251, 191, 36, 0.35); box-shadow: var(--shadow-md); transition: transform 0.25s ease; overflow: hidden; }
.logo-area:hover .logo-icon { transform: rotate(-5deg) scale(1.05); }
.hoopoe-svg { width: 40px; height: 40px; display: block; }
.preloader-hoopoe-svg { width: 64px; height: 64px; display: block; }
.brand-sub { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-top: -2px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.timer-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.timer-time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--accent); min-width: 48px; text-align: center; }
.timer-mode { font-size: 11px; color: var(--muted); background: var(--surface); padding: 2px 7px; border-radius: 8px; border: 1px solid var(--line); }
.timer-btn { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
.timer-btn:hover { border-color: var(--accent); color: var(--accent); }
.timer-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.icon-btn { background: var(--bg); border: 1px solid var(--line); color: var(--ink); width: 40px; height: 40px; border-radius: 13px; cursor: pointer; font-size: 16px; font-weight: 700; display: grid; place-items: center; transition: 0.2s; }
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

.install-app-btn {
  background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff;
  border: 0; border-radius: 13px; padding: 8px 13px; font: inherit;
  font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; box-shadow: var(--shadow-sm); transition: 0.2s;
}
.install-app-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

.hub-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.hub-tab { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: 14px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
.hub-tab:hover { border-color: var(--accent); transform: translateY(-1px); }
.hub-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: center; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
.stat-card:hover { transform: translateY(-2px); }
.stat-val { font-size: 23px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }

.progress-wrap { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); }
.progress-bar-bg { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 99px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.progress-text { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }

.toolbar { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.search-box { position: relative; flex: 1; min-width: 240px; }
.search-box input { width: 100%; padding: 13px 42px 13px 72px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px); transition: 0.2s; }
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--tint); }
.search-box::before { content: '🔍'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 17px; opacity: 0.55; }
.kbd-hint { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); background: var(--bg); padding: 3px 7px; border-radius: 7px; border: 1px solid var(--line); pointer-events: none; }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
.filter-chip { background: var(--surface); border: 1px solid var(--line); color: var(--muted); padding: 6px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
.filter-chip:hover { border-color: var(--accent); color: var(--ink); }
.filter-chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filter-sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }

.btn { border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--accent-hover); transform: translateY(-1.5px); box-shadow: var(--shadow-md); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.success { background: var(--success); color: #fff; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 11px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.cat-card { position: relative; background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow-sm); animation: fadeIn 0.4s ease forwards; opacity: 0; }
@keyframes fadeIn { to { opacity: 1; } }
.cat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--accent); }
.cat-icon { font-size: 40px; margin-bottom: 10px; transition: transform 0.25s ease; }
.cat-card:hover .cat-icon { transform: scale(1.08); }
.cat-name { font-weight: 700; font-size: 17px; }
.cat-mini-prog { height: 5px; background: var(--line); border-radius: 5px; margin-top: 12px; overflow: hidden; }
.cat-mini-fill { height: 100%; background: var(--success); transition: width 0.3s; }
.cat-admin-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
.mini-icon-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: 28px; height: 28px; font-size: 12px; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
.mini-icon-btn:hover { border-color: var(--accent); transform: scale(1.1); }

.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.file-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.25s ease; animation: fadeIn 0.4s ease forwards; opacity: 0; }
.file-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.file-card.completed { border-right: 4px solid var(--success); }
.file-header { display: flex; justify-content: space-between; align-items: center; }
.file-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.file-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--tint); color: var(--accent); flex-shrink: 0; }
.file-type-pdf { color: #dc2626; background: rgba(239, 68, 68, 0.14); }
.file-type-img { color: #059669; background: rgba(16, 185, 129, 0.14); }
.file-type-vid { color: #d97706; background: rgba(245, 158, 11, 0.16); }
.file-type-mp4 { color: #7c3aed; background: rgba(139, 92, 246, 0.16); }
.cat-badge { font-size: 11px; background: var(--bg); border: 1px solid var(--line); padding: 3px 8px; border-radius: 8px; color: var(--muted); font-weight: 600; }
.done-badge { font-size: 11px; background: rgba(16, 185, 129, 0.16); color: var(--success); padding: 3px 8px; border-radius: 8px; font-weight: 700; }
.lesson-tip-box { background: rgba(79, 70, 229, 0.07); border-right: 3px solid var(--accent); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; color: var(--ink); margin-top: 8px; }
.lesson-tip-label { font-weight: 700; color: var(--accent); margin-left: 4px; }
.ext-links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.ext-link-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; text-decoration: none; padding: 5px 10px; border-radius: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); transition: 0.2s; }
.ext-link-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.ext-link-chip.yt { color: #dc2626; border-color: rgba(220, 38, 38, 0.25); background: rgba(220, 38, 38, 0.07); }
.star-btn { background: none; border: 0; font-size: 24px; cursor: pointer; color: var(--muted); transition: 0.2s; line-height: 1; padding: 0; }
.star-btn.active { color: var(--star); transform: scale(1.1); }
.file-title { font-weight: 700; font-size: 17px; margin: 0; }
.file-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-pill { font-size: 11px; color: var(--accent); background: var(--tint); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.file-date { font-size: 12px; color: var(--muted); margin-top: 8px; }
.file-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.file-actions button { flex: 1; }

.panel-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }

/* تصميم استوديو الاختبارات العالمي (مرتكز على نص الملف والصفحات فقط) */
.quiz-studio-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  flex-wrap: wrap; gap: 14px; margin-bottom: 18px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
}
.quiz-pro-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--tint); color: var(--accent);
  font-size: 11.5px; font-weight: 700; padding: 4px 11px;
  border-radius: 99px; margin-bottom: 6px;
}
.quiz-mode-switch {
  display: inline-flex; gap: 5px; background: var(--bg);
  padding: 5px; border-radius: 15px; border: 1px solid var(--line); flex-wrap: wrap;
}
.quiz-mode-btn {
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 12.5px; font-weight: 700;
  padding: 8px 14px; border-radius: 11px; cursor: pointer; transition: 0.2s;
}
.quiz-mode-btn.active { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }

.quiz-source-workbench {
  background: linear-gradient(145deg, rgba(79, 70, 229, 0.06), rgba(16, 185, 129, 0.04));
  border: 1px solid rgba(79, 70, 229, 0.22);
  border-radius: 20px; padding: 18px; margin-bottom: 18px;
}
.quiz-source-top {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px; margin-bottom: 14px;
}
.quiz-file-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface-solid); border: 1px solid var(--line);
  border-radius: 13px; padding: 7px 13px; font-size: 13px; font-weight: 700;
}
.quiz-isolated-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(16, 185, 129, 0.14); color: var(--success);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 99px; padding: 4px 11px; font-size: 11.5px; font-weight: 700;
}

.quiz-controls-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px; align-items: end; background: var(--surface-solid);
  border: 1px solid var(--line); border-radius: 16px; padding: 14px;
}
.quiz-controls-grid input[type="number"], .quiz-controls-grid select {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--ink); font: inherit; font-weight: 700; width: 100%;
}

.quiz-text-inspector {
  margin-top: 14px; background: var(--surface-solid);
  border: 1px solid var(--line); border-right: 4px solid var(--accent);
  border-radius: 15px; padding: 13px 15px;
}
.quiz-inspector-head {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
}
.quiz-text-stream {
  font-size: 12.5px; color: var(--muted); max-height: 135px;
  overflow-y: auto; line-height: 1.75; white-space: pre-line;
  background: var(--bg); padding: 10px 12px; border-radius: 11px;
}
.page-pill {
  display: inline-block; font-size: 11px; font-weight: 700;
  color: var(--accent); background: var(--tint);
  padding: 1px 7px; border-radius: 6px; margin-left: 6px;
}

.quiz-session-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 16px; margin-bottom: 16px;
}
.quiz-progress-mini { flex: 1; min-width: 180px; }
.quiz-progress-track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.3s ease; }

.quiz-q-card {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 20px; padding: 20px; transition: border-color 0.2s, transform 0.2s;
}
.quiz-q-card.answered-ok { border-color: rgba(16, 185, 129, 0.45); }
.quiz-q-card.answered-bad { border-color: rgba(239, 68, 68, 0.45); }

.quiz-q-top {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
}
.quiz-q-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700;
  color: var(--accent); background: var(--tint); padding: 4px 10px;
  border-radius: 8px;
}
.quiz-q-type {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--surface-solid); border: 1px solid var(--line);
  padding: 3px 9px; border-radius: 8px;
}
.quiz-q-prompt {
  font-weight: 700; margin-bottom: 12px; font-size: 15.5px;
  line-height: 1.65; color: var(--ink);
}
.quiz-quote-box {
  background: var(--surface-solid); border: 1px dashed rgba(79, 70, 229, 0.35);
  border-radius: 12px; padding: 10px 13px; margin-bottom: 12px;
  font-size: 13px; color: var(--ink); line-height: 1.65;
}

.quiz-option-btn {
  width: 100%; text-align: right; background: var(--surface-solid);
  border: 1px solid var(--line); color: var(--ink); padding: 12px 15px;
  border-radius: 13px; font: inherit; font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: 0.18s; line-height: 1.55;
}
.quiz-option-btn:hover { border-color: var(--accent); transform: translateX(-3px); }
.quiz-option-btn.correct { background: rgba(16, 185, 129, 0.16); border-color: var(--success); color: var(--success); font-weight: 700; }
.quiz-option-btn.wrong { background: rgba(239, 68, 68, 0.14); border-color: var(--danger); color: var(--danger); }

.quiz-evidence-box {
  margin-top: 12px; background: var(--surface-solid);
  border: 1px solid var(--line); border-radius: 13px;
  padding: 11px 14px; font-size: 13px; line-height: 1.65;
}

.quiz-result-box {
  margin-top: 20px; background: linear-gradient(135deg, var(--tint), rgba(16, 185, 129, 0.08));
  border: 1px solid var(--accent); border-radius: 20px; padding: 22px; text-align: center;
}

let largeFilesDb = null;
function openLargeFilesDb() {
  return new Promise((resolve, reject) => {
    if (largeFilesDb) return resolve(largeFilesDb);
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB غير مدعوم'));
    const req = indexedDB.open('hudhud_large_files_db', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('files')) {
        db.createObjectStore('files', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => {
      largeFilesDb = e.target.result;
      resolve(largeFilesDb);
    };
    req.onerror = () => reject(req.error);
  });
}

async function saveLargeFileContent(id, type, content) {
  const db = await openLargeFilesDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put({ id, type, content, updatedAt: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getLargeFileContent(id) {
  const db = await openLargeFilesDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(id);
    req.onsuccess = () => resolve(req.result ? req.result.content : null);
    req.onerror = () => reject(req.error);
  });
}

async function deleteLargeFileContent(id) {
  try {
    const db = await openLargeFilesDb();
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(id);
  } catch (e) {}
}

  const preloaderSvg = masterSvg.cloneNode(true);

  const preloaderBox = $('preloaderHoopoeBox');

  try {
    const exportSvg = masterSvg.cloneNode(true);
    exportSvg.setAttribute('width', '512');
    exportSvg.setAttribute('height', '512');
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(exportSvg);
    const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });

let audioCtxInstance = null;
function getAudioContext() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  if (!audioCtxInstance) audioCtxInstance = new AudioCtx();
  if (audioCtxInstance.state === 'suspended') {
    audioCtxInstance.resume().catch(() => {});
  }
  return audioCtxInstance;
}

function playGentleChime(completedMode = 'study') {
  const ctx = getAudioContext();
  if (!ctx) return;
  const notes = completedMode === 'study'
    ? [523.25, 659.25, 783.99, 1046.50]
    : [659.25, 587.33, 523.25];
  const now = ctx.currentTime;

  notes.forEach((freq, i) => {
    const startTime = now + i * 0.22;
    const duration = 0.75;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.14, startTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  });
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

async function parsePdfFromBase64(base64Str) {
  if (!window.pdfjsLib || !base64Str) return null;
  const raw = atob(base64Str);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const loadingTask = window.pdfjsLib.getDocument({ data: bytes });
  const doc = await loadingTask.promise;
  quizPdfDocProxy = doc;
  quizPdfTotalPages = doc.numPages || 1;
  quizSettings.pageFrom = Math.max(1, Math.min(quizSettings.pageFrom || 1, quizPdfTotalPages));
  quizSettings.pageTo = Math.max(quizSettings.pageFrom, Math.min(quizSettings.pageTo || Math.min(5, quizPdfTotalPages), quizPdfTotalPages));
  writeJson('hudhud_quiz_settings', quizSettings);
  return doc;
}

async function resolveSelectedLibraryPdfBase64(fileId) {
  const f = lib.files.find(item => item.id === fileId && item.type === 'pdf');
  if (!f) return null;
  let content = f.content;
  if (!content && f.idbStored) {
    content = await getLargeFileContent(f.id);
    if (content) f.content = content;
  }
  return content ? { file: f, base64: content } : { file: f, base64: '' };
}

async function extractPagesTextFromPdf(fromPage, toPage) {
  if (!quizPdfDocProxy && quizPdfBase64Cache) {
    await parsePdfFromBase64(quizPdfBase64Cache);
  }
  if (!quizPdfDocProxy) {
    return { text: '', pageCount: 0, status: 'no_doc', pages: [] };
  }

  const total = quizPdfDocProxy.numPages || 1;
  const start = Math.max(1, Math.min(Number(fromPage) || 1, total));
  const end = Math.max(start, Math.min(Number(toPage) || start, total));
  quizSettings.pageFrom = start;
  quizSettings.pageTo = end;
  writeJson('hudhud_quiz_settings', quizSettings);

  const pageTexts = [];
  for (let p = start; p <= end; p++) {
    try {
      const page = await quizPdfDocProxy.getPage(p);
      const tc = await page.getTextContent();
      const rawStr = (tc.items || []).map(it => it.str || '').join(' ');
      const cleanStr = rawStr.replace(/\s+/g, ' ').trim();
      pageTexts.push({ pageNum: p, text: cleanStr });
    } catch (e) {
      pageTexts.push({ pageNum: p, text: '' });
    }
  }

  const combined = pageTexts
    .filter(x => x.text)
    .map(x => `[صفحة ${x.pageNum}] ${x.text}`)
    .join('\n');

  return {
    text: combined,
    pageCount: end - start + 1,
    status: combined.trim().length > 20 ? 'ok' : 'scanned_or_empty',
    pages: pageTexts
  };
}

  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf')) return showToast('يرجى اختيار ملف بصيغة PDF', 'error');
  if (file.size > MAX_LARGE_FILE_BYTES) return showToast('الحد الأقصى لملف PDF هو 25 MB', 'error');

  const sizeKb = Math.round(file.size / 1024);
  quizPdfMeta = {
    name: file.name,
    sizeKb,
    sourceLabel: 'ملف مرفوع للاختبار',
    addedAt: new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' })
  };
  writeJson('hudhud_quiz_pdf_meta', quizPdfMeta);

  const reader = new FileReader();
  reader.onload = async (e) => {
    quizPdfBase64Cache = String(e.target.result || '').split(',')[1] || '';
    quizPdfDocProxy = null;
    quizSettings.sourceType = 'upload';
    writeJson('hudhud_quiz_settings', quizSettings);
    await parsePdfFromBase64(quizPdfBase64Cache);
    quizRangeExtractInfo = await extractPagesTextFromPdf(quizSettings.pageFrom, quizSettings.pageTo);
    showToast(`تم تحميل «${quizPdfMeta.name}» (${quizPdfTotalPages} صفحة) 📄`);
    await buildAndRenderQuiz(false);
  };
  reader.readAsDataURL(file);
}

async function selectLibraryPdfForQuiz(fileId) {

  quizSettings.libraryFileId = fileId;
  writeJson('hudhud_quiz_settings', quizSettings);

  if (!fileId) {
    quizPdfMeta = null;
    quizPdfBase64Cache = '';
    quizPdfDocProxy = null;
    quizPdfTotalPages = 0;
    quizRangeExtractInfo = { text: '', pageCount: 0, status: 'idle', pages: [] };

  }

  const resolved = await resolveSelectedLibraryPdfBase64(fileId);

  quizPdfMeta = {
    name: resolved.file.title + (resolved.file.title.toLowerCase().endsWith('.pdf') ? '' : '.pdf'),
    sizeKb: resolved.file.sizeKb || 0,
    sourceLabel: 'ملف من المنصة (معزول عن باقي الدروس)',
    fileId: resolved.file.id

  } else {
    quizRangeExtractInfo = { text: '', pageCount: 0, status: 'missing_local_blob', pages: [] };

function tokenizeWords(str) {
  return (str || '')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, ' ')
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2);
}

/* يولّد أسئلة مبنية حصرياً على النص الموجود في الصفحات المحددة من الملف فقط */
function generateLiteralPageTextQuestions(docName, extractInfo) {
  const cleanTitle = docName.replace(/\.pdf$/i, '');
  const pagesWithText = (extractInfo.pages || []).filter(p => p.text && p.text.trim().length >= 25);

  const segments = [];
  pagesWithText.forEach(pObj => {
    const chunks = pObj.text
      .split(/[.؟!؛:\n]+/)
      .map(c => c.replace(/\s+/g, ' ').trim())
      .filter(c => c.length >= 28 && c.length <= 220);

    chunks.forEach(chunk => {
      segments.push({ pageNum: pObj.pageNum, text: chunk });
    });

    // إذا كانت الصفحة كتلة نصية طويلة دون نقاط فاصلة كثيرة، نقسمها إلى مقاطع مترابطة
    if (chunks.length === 0 && pObj.text.length >= 35) {
      const words = pObj.text.split(/\s+/);
      for (let i = 0; i < words.length; i += 16) {
        const piece = words.slice(i, i + 16).join(' ').trim();
        if (piece.length >= 28) {
          segments.push({ pageNum: pObj.pageNum, text: piece });
        }
      }
    }
  });

  if (segments.length === 0) return [];

  const allSegmentTexts = segments.map(s => s.text);
  const questions = [];

  // 1) سؤال إكمال النص الحرفي من الصفحة المحددة
  segments.forEach((seg, idx) => {
    const words = seg.text.split(/\s+/);
    if (words.length >= 6) {
      const splitIdx = Math.max(2, Math.min(words.length - 2, Math.floor(words.length * 0.6)));
      const prefix = words.slice(0, splitIdx).join(' ');
      const realEnding = words.slice(splitIdx).join(' ');

      const wrongEndings = [];
      for (let k = 1; k < segments.length && wrongEndings.length < 2; k++) {
        const candWords = segments[(idx + k) % segments.length].text.split(/\s+/);
        if (candWords.length >= 3) {
          const candEnd = candWords.slice(Math.floor(candWords.length * 0.5)).join(' ');
          if (candEnd && candEnd !== realEnding && !wrongEndings.includes(candEnd)) {
            wrongEndings.push(candEnd);
          }
        }
      }

      if (wrongEndings.length >= 2) {
        const opts = shuffleArray([
          { text: realEnding, ok: true },
          { text: wrongEndings[0], ok: false },
          { text: wrongEndings[1], ok: false }
        ]);
        questions.push({
          typeLabel: 'إكمال من النص',
          badge: `📄 ${cleanTitle} • صفحة ${seg.pageNum}`,
          prompt: `أكمل العبارة كما وردت في الصفحة (${seg.pageNum}) من الملف:`,
          quote: `«${prefix} ...»`,
          options: opts.map(o => o.text),
          correct: opts.findIndex(o => o.ok),
          explain: `النص الكامل في صفحة ${seg.pageNum}: «${seg.text}»`,
          evidence: `المصدر: ${cleanTitle} — صفحة ${seg.pageNum}`
        });
      }
    }
  });

  // 2) سؤال تحديد النص الوارد حرفياً في صفحة معينة ضمن النطاق المحدد
  segments.forEach((seg, idx) => {
    const otherPages = segments.filter(s => s.pageNum !== seg.pageNum && s.text !== seg.text);
    const poolForWrong = otherPages.length >= 2
      ? otherPages
      : segments.filter((_, i) => i !== idx);

    if (poolForWrong.length >= 2) {
      const w1 = poolForWrong[idx % poolForWrong.length].text;
      const w2 = poolForWrong[(idx + 1) % poolForWrong.length].text;
      if (w1 !== seg.text && w2 !== seg.text && w1 !== w2) {
        const opts = shuffleArray([
          { text: seg.text, ok: true },
          { text: w1, ok: false },
          { text: w2, ok: false }
        ]);
        questions.push({
          typeLabel: 'نص الصفحة',
          badge: `📄 ${cleanTitle} • صفحة ${seg.pageNum}`,
          prompt: `أي من النصوص التالية ورد حرفياً في الصفحة (${seg.pageNum})؟`,
          quote: '',
          options: opts.map(o => o.text),
          correct: opts.findIndex(o => o.ok),
          explain: `هذا المقطع موجود نصياً في صفحة ${seg.pageNum} من «${cleanTitle}».`,
          evidence: `المصدر: ${cleanTitle} — صفحة ${seg.pageNum}`
        });
      }
    }
  });

  // 3) سؤال مطابقة المقطع النصي مع رقم الصفحة الصحيحة داخل النطاق المحدد
  if (pagesWithText.length >= 2) {
    segments.forEach((seg, idx) => {
      const otherPageNums = [...new Set(pagesWithText.map(p => p.pageNum).filter(n => n !== seg.pageNum))];
      if (otherPageNums.length >= 1) {
        const wrongChoices = [];
        for (let m = 0; m < otherPageNums.length && wrongChoices.length < 2; m++) {
          wrongChoices.push(`صفحة ${otherPageNums[(idx + m) % otherPageNums.length]}`);
        }
        if (wrongChoices.length < 2) {
          wrongChoices.push(`صفحة غير واردة في نطاق (${quizSettings.pageFrom}–${quizSettings.pageTo})`);
        }
        const opts = shuffleArray([
          { text: `صفحة ${seg.pageNum}`, ok: true },
          { text: wrongChoices[0], ok: false },
          { text: wrongChoices[1], ok: false }
        ]);
        questions.push({
          typeLabel: 'تحديد الصفحة',
          badge: `📄 ${cleanTitle} • نطاق ${quizSettings.pageFrom}–${quizSettings.pageTo}`,
          prompt: `في أي صفحة من النطاق المحدد ورد هذا النص حرفياً؟`,
          quote: `«${seg.text}»`,
          options: opts.map(o => o.text),
          correct: opts.findIndex(o => o.ok),
          explain: `ورد هذا النص في الصفحة ${seg.pageNum} من ملف «${cleanTitle}».`,
          evidence: `النص الكامل في صفحة ${seg.pageNum}: «${seg.text}»`
        });
      }
    });
  }

  // فلترة حسب نوع الأسئلة المختار إن وجد
  if (quizSettings.difficulty === 'recall') {
    const rec = questions.filter(q => q.typeLabel !== 'تحديد الصفحة');
    return rec.length ? rec : questions;
  }
  if (quizSettings.difficulty === 'locate') {
    const loc = questions.filter(q => q.typeLabel === 'تحديد الصفحة');
    return loc.length ? loc : questions;
  }

  return questions;
}

async function buildAndRenderQuiz(notify = false) {
  quizSettings.seed = (quizSettings.seed || 1) + 1;
  writeJson('hudhud_quiz_settings', quizSettings);

  const targetCount = Math.max(3, Math.min(20, Number(quizSettings.count) || 8));
  currentQuizQuestions = [];
  quizAnswers = {};
  quizRecordedCurrentRun = false;

  if (quizSettings.sourceType === 'library') {
    const pdfs = lib.files.filter(f => f.type === 'pdf');
    if (pdfs.length > 0) {
      const targetId = (quizSettings.libraryFileId && pdfs.some(p => p.id === quizSettings.libraryFileId))
        ? quizSettings.libraryFileId
        : pdfs[0].id;
      quizSettings.libraryFileId = targetId;
      writeJson('hudhud_quiz_settings', quizSettings);

      const resolved = await resolveSelectedLibraryPdfBase64(targetId);
      if (resolved) {
        quizPdfMeta = {
          name: resolved.file.title + (resolved.file.title.toLowerCase().endsWith('.pdf') ? '' : '.pdf'),
          sizeKb: resolved.file.sizeKb || 0,
          sourceLabel: 'ملف من المنصة (معزول عن باقي الدروس)',
          fileId: resolved.file.id
        };
        if (resolved.base64) {
          quizPdfBase64Cache = resolved.base64;
          quizPdfDocProxy = null;
          await parsePdfFromBase64(quizPdfBase64Cache);
          quizRangeExtractInfo = await extractPagesTextFromPdf(quizSettings.pageFrom, quizSettings.pageTo);
        } else {
          quizPdfBase64Cache = '';
          quizPdfDocProxy = null;
          quizRangeExtractInfo = { text: '', pageCount: 0, status: 'missing_local_blob', pages: [] };
        }
      }
    } else {
      quizRangeExtractInfo = { text: '', pageCount: 0, status: 'no_library_pdf', pages: [] };
    }
  } else if (quizPdfMeta && quizPdfBase64Cache) {
    if (!quizPdfDocProxy) {
      await parsePdfFromBase64(quizPdfBase64Cache);
    }
    quizRangeExtractInfo = await extractPagesTextFromPdf(quizSettings.pageFrom, quizSettings.pageTo);
  }

  let pool = [];
  if (quizPdfMeta && quizRangeExtractInfo.status === 'ok') {
    pool = generateLiteralPageTextQuestions(quizPdfMeta.name, quizRangeExtractInfo);
  }

  // ترتيب الأسئلة واختيار العدد المطلوب دون إضافة أي أسئلة من خارج نص الملف
  if (pool.length > 0) {
    const shuffledPool = shuffleArray(pool);
    const limit = Math.min(targetCount, shuffledPool.length);
    for (let i = 0; i < limit; i++) {
      currentQuizQuestions.push({ ...shuffledPool[i], qNum: i + 1 });
    }
  }

  if (notify) {
    if (currentQuizQuestions.length > 0) {
      showToast(`تم توليد ${currentQuizQuestions.length} سؤالاً من نص الصفحات (${quizSettings.pageFrom}–${quizSettings.pageTo}) فقط 🎯`);
    } else {
      showToast('لم يتم العثور على نص مقروء كافٍ في الصفحات المحددة من هذا الملف', 'error');
    }
  }

  if (activeHubTab === 'quiz') renderSmartHub();
}

function answerQuiz(qIdx, chosenIdx) {
  const q = currentQuizQuestions[qIdx];
  if (!q) return;
  quizAnswers[qIdx] = chosenIdx;

  const box = $('qOpts_' + qIdx);
  const expEl = $('qExplain_' + qIdx);
  const cardEl = $('qCard_' + qIdx);
  const isOk = chosenIdx === q.correct;

  if (cardEl) {
    cardEl.classList.remove('answered-ok', 'answered-bad');
    cardEl.classList.add(isOk ? 'answered-ok' : 'answered-bad');
  }
  if (box) {
    box.querySelectorAll('.quiz-option-btn').forEach((b, i) => {
      b.classList.remove('correct', 'wrong');
      if (i === q.correct) b.classList.add('correct');
      else if (i === chosenIdx && chosenIdx !== q.correct) b.classList.add('wrong');
    });
  }
  if (expEl) {
    expEl.style.display = 'block';
    expEl.innerHTML = `<div style="font-weight:700; color:${isOk ? 'var(--success)' : 'var(--danger)'}; margin-bottom:4px;">${isOk ? '✅ إجابة مطابقة لنص الملف' : '❌ إجابة غير مطابقة — راجع النص المرجعي'}</div>
      <div style="color:var(--ink);">${escapeHtml(q.explain)}</div>
      <div style="font-size:11.5px; color:var(--muted); margin-top:4px;">${escapeHtml(q.evidence)}</div>`;
  }

  const answeredCount = Object.keys(quizAnswers).length;
  const scoreCount = Object.entries(quizAnswers).filter(([idx, val]) => currentQuizQuestions[Number(idx)]?.correct === val).length;
  const liveScoreEl = $('quizLiveScore');
  const livePctEl = $('quizProgressFill');
  if (liveScoreEl) liveScoreEl.textContent = `المجاب: ${answeredCount} / ${currentQuizQuestions.length} | الدرجة: ${scoreCount}`;
  if (livePctEl && currentQuizQuestions.length) {
    livePctEl.style.width = Math.round((answeredCount / currentQuizQuestions.length) * 100) + '%';
  }

  if (answeredCount === currentQuizQuestions.length && !quizRecordedCurrentRun) {
    quizRecordedCurrentRun = true;
    const pct = Math.round((scoreCount / currentQuizQuestions.length) * 100);
    const label = quizPdfMeta
      ? `${quizPdfMeta.name} (ص ${quizSettings.pageFrom}–${quizSettings.pageTo})`
      : 'اختبار ملف';
    quizHistory.unshift({
      run: quizSettings.seed,
      label,
      score: scoreCount,
      total: currentQuizQuestions.length,
      pct,
      time: new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' })
    });
    quizHistory = quizHistory.slice(0, 8);
    writeJson('hudhud_quiz_history', quizHistory);
    if (pct >= 70) confetti({ particleCount: 80, spread: 65, origin: { y: 0.65 } });
    renderSmartHub();
  }
}

function clearQuizHistory() {
  quizHistory = [];
  localStorage.removeItem('hudhud_quiz_history');

function exportBackupJson() {
  const payload = {
    exportedAt: new Date().toISOString(),
    lib,
    quizHistory,
    quizPdfMeta,
    favs,
    completed
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hudhud-backup-' + dayKey(Date.now()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تصدير النسخة الاحتياطية بنجاح 📤');
}

function importBackupJson(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.lib && Array.isArray(data.lib.files)) {
        lib = data.lib;
        writeJson('hudhud_lib_cache', lib);
      }
      if (Array.isArray(data.quizHistory)) { quizHistory = data.quizHistory; writeJson('hudhud_quiz_history', quizHistory); }
      if (data.quizPdfMeta) { quizPdfMeta = data.quizPdfMeta; writeJson('hudhud_quiz_pdf_meta', quizPdfMeta); }
      if (Array.isArray(data.favs)) { favs = data.favs; writeJson('favs', favs); }
      if (Array.isArray(data.completed)) { completed = data.completed; writeJson('completed', completed); }
      showToast('تم استيراد النسخة الاحتياطية وتحديث الواجهة 📥');
      render();
      if (activeHubTab === 'cmd') renderCmd();
      else renderSmartHub();
    } catch (err) {
      showToast('ملف النسخة الاحتياطية غير صالح', 'error');
    }
  };
  reader.readAsText(file);
}

function clearLocalLessonCache() {
  localStorage.removeItem('hudhud_lib_cache');

function toggleCompletedCurrent() {
  if (!currentViewerFile || currentViewerFile.id === 'quiz_pdf_preview') return;
  const id = currentViewerFile.id;
  const was = completed.includes(id);
  if (!was) {
    completed.push(id);
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#4f46e5', '#10b981', '#fbbf24'] });
    showToast('تم تسجيل الدرس كمكتمل 🎉');
  } else {
    completed = completed.filter(c => c !== id);
    showToast('تم إلغاء علامة الإكمال');
  }
  writeJson('completed', completed);

  const now = completed.includes(id);
  const R = readJson('hudhud_reviews', {});
  const C = readJson('hudhud_comp_log', {});
  const tk = dayKey(Date.now());
  if (now && !was) {
    R[id] = { step: 0, due: Date.now() + DAY };
    C[tk] = (C[tk] || 0) + 1;
  } else if (!now && was) {
    delete R[id];
    if (C[tk] > 0) C[tk]--;
  }
  writeJson('hudhud_reviews', R);
  writeJson('hudhud_comp_log', C);

  if (now && !was && C[tk] >= getDailyPlan().goal && !localStorage.getItem('hudhud_goal_' + tk)) {
    localStorage.setItem('hudhud_goal_' + tk, '1');
    setTimeout(() => {
      confetti({ particleCount: 220, spread: 120, origin: { y: 0.5 } });
      showToast('🏆 حققت هدف اليوم! هدهد فخور بيك');
    }, 500);
  }

  updateViewerDoneBtn();
  render();
  if (activeHubTab === 'cmd') renderCmd();
}

function buildLightFirebasePayload() {
  const lightFiles = (lib.files || []).map(f => {
    if (f.idbStored) {
      const { content, ...rest } = f;
      return rest;
    }
    return f;
  });
  return {
    ...lib,
    files: lightFiles
  };
}

async function loadData() {
  const cachedData = localStorage.getItem('hudhud_lib_cache');
  if (cachedData) {
    try {
      lib = JSON.parse(cachedData);
      $('siteTitle').textContent = lib.settings.siteName || 'هدهد';
      render();
    } catch (e) {}
  } else {
    $('content').innerHTML = `<div class="files-grid"><div class="file-card skeleton" style="height:160px"></div><div class="file-card skeleton" style="height:160px"></div></div>`;
  }

  try {
    const r = await fetch(FIREBASE_URL + 'data.json');
    const data = await r.json();
    if (data) {
      const localFilesMap = new Map((lib.files || []).map(f => [f.id, f]));
      lib.files = (data.files || []).map(remoteFile => {
        const localFile = localFilesMap.get(remoteFile.id);
        if (remoteFile.idbStored && localFile && localFile.content) {
          return { ...remoteFile, content: localFile.content };
        }
        return remoteFile;
      });
      const mergedIds = new Set(lib.files.map(f => f.id));
      localFilesMap.forEach((lf, id) => {
        if (!mergedIds.has(id) && lf.idbStored) lib.files.push(lf);
      });

      lib.categories = (data.categories && data.categories.length) ? data.categories : DEFAULT_CATS;
      if (data.settings) lib.settings = data.settings;
      writeJson('hudhud_lib_cache', buildLightFirebasePayload());
      $('siteTitle').textContent = lib.settings.siteName || 'هدهد';
      render();
      checkUrlHash();
    } else if (!cachedData) {
      lib.categories = DEFAULT_CATS;
      render();
    }
  } catch (e) {
    if (!cachedData) {
      $('content').innerHTML = `<p style="text-align:center; color:var(--danger); margin-top:40px; font-size:16px;">لا يوجد اتصال بالإنترنت، ولم تقم بزيارة الموقع سابقاً لحفظ الدروس. يرجى الاتصال بالإنترنت أولاً.</p>`;
    }
  }
}

async function saveData() {
  const lightPayload = buildLightFirebasePayload();
  writeJson('hudhud_lib_cache', lightPayload);
  try {
    const u = firebase.auth().currentUser;
    if (!u) throw new Error('no auth');
    const token = await u.getIdToken();
    const r = await fetch(FIREBASE_URL + 'data.json?auth=' + encodeURIComponent(token), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(lightPayload)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) {
    showToast('تم الحفظ محلياً؛ تحقق من تسجيل الدخول وصلاحيات القاعدة للمزامنة السحابية.', 'error');
  }
}

function getLinkIcon(url, label) {
  const u = (url || '').toLowerCase(); const l = (label || '').toLowerCase();
  if (u.includes('youtube.com') || u.includes('youtu.be') || l.includes('يوتيوب')) return { icon: '▶️', cls: 'yt' };
  if (l.includes('اختبار') || l.includes('امتحان') || u.includes('forms.gle') || u.includes('quiz')) return { icon: '📝', cls: '' };
  if (u.includes('t.me') || l.includes('تليجرام')) return { icon: '✈️', cls: '' };
  return { icon: '🔗', cls: '' };
}
function normalizeUrl(url) { if (!url) return ''; return /^https?:\/\//i.test(url) ? url : 'https://' + url; }
function buildExtLinksHtml(links) {
  if (!Array.isArray(links) || !links.length) return '';
  return `<div class="ext-links-row">` + links.map(lk => {
    const meta = getLinkIcon(lk.url, lk.label);
    const safeUrl = escapeHtml(normalizeUrl(lk.url));
    const safeLabel = escapeHtml(lk.label || 'رابط مرفق');
    return `<a class="ext-link-chip ${meta.cls}" href="${safeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${meta.icon} ${safeLabel}</a>`;
  }).join('') + `</div>`;
}

function renderFilterBar() {
  const bar = $('filterBar');
  const query = $('searchInput').value.trim();
  const showFilters = query.length > 0 || currentCatId !== null || showFavorites;
  if (!showFilters) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const typeChips = [{ key: 'all', label: 'الكل' }, { key: 'html', label: 'تفاعلي HTML' }, { key: 'pdf', label: 'PDF' }, { key: 'video', label: 'فيديو' }];
  const allTags = [...new Set(lib.files.flatMap(f => Array.isArray(f.tags) ? f.tags : []))];
  let html = typeChips.map(t => `<button class="filter-chip ${activeTypeFilter === t.key ? 'active' : ''}" onclick="setTypeFilter('${t.key}')">${t.label}</button>`).join('');
  if (allTags.length) {
    html += `<span class="filter-sep"></span>` + allTags.map(tag => `<button class="filter-chip ${activeTagFilter === tag ? 'active' : ''}" onclick="toggleTagFilter('${escapeHtml(tag)}')">#${escapeHtml(tag)}</button>`).join('');
  }
  if (activeTypeFilter !== 'all' || activeTagFilter) html += `<button class="filter-chip" onclick="resetFilters()">✕ مسح الفلاتر</button>`;
  bar.innerHTML = html;
}
function setTypeFilter(type) { activeTypeFilter = type; saveUiState(); render(); }
function toggleTagFilter(tag) { activeTagFilter = activeTagFilter === tag ? '' : tag; saveUiState(); render(); }
function resetFilters() { activeTypeFilter = 'all'; activeTagFilter = ''; saveUiState(); render(); }
function applyQuickFilters(files) {
  return files.filter(f => {
    if (activeTypeFilter === 'html' && f.type !== 'html') return false;
    if (activeTypeFilter === 'pdf' && f.type !== 'pdf') return false;
    if (activeTypeFilter === 'video' && !['youtube', 'mp4'].includes(f.type)) return false;
    if (activeTagFilter && !(Array.isArray(f.tags) && f.tags.includes(activeTagFilter))) return false;
    return true;
  });
}

    <div class="stat-card"><div class="stat-val">${todaySessions}</div><div class="stat-lbl">جلسات اليوم</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--success)">${completedCount}</div><div class="stat-lbl">المنجزة</div></div>`;
  progWrap.innerHTML = `<span class="progress-text">مستوى الإنجاز العام</span><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div><span class="progress-text">${pct}%</span>`;

  if (activeHubTab !== 'lessons') return;
  renderFilterBar();
  const query = $('searchInput').value.trim().toLowerCase();
  if (query.length > 0) {
    const matched = lib.files.filter(f =>
      f.title.toLowerCase().includes(query) ||
      (f.note && f.note.toLowerCase().includes(query)) ||
      (f.tags && f.tags.some(t => t.toLowerCase().includes(query))) ||
      (f.links && f.links.some(l => (l.label || '').toLowerCase().includes(query)))
    );
    renderFilesList(c, applyQuickFilters(matched), 'نتائج البحث', true);
  } else if (currentCatId === null && !showFavorites) {
    currentOrderedList = [];
    let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;"><h2 style="margin:0; font-size:20px;">تصفح الأقسام</h2><div style="display:flex; gap:10px;"><button class="btn ghost small" onclick="showFavorites = true; render()">⭐ المفضلة (${favs.length})</button>${isAdmin ? `<button class="btn ghost small" onclick="openSettings()">⚙️ الإعدادات</button>` : ''}</div></div><div class="cat-grid">`;
    lib.categories.forEach(cat => {
      const catFiles = lib.files.filter(f => f.catId === cat.id);
      const catDone = catFiles.filter(f => completed.includes(f.id)).length;
      const catPct = catFiles.length ? Math.round((catDone / catFiles.length) * 100) : 0;
      html += `<div class="cat-card" onclick="currentCatId='${cat.id}'; render()">${isAdmin ? `<div class="cat-admin-tools"><button class="mini-icon-btn" onclick="editCategory('${cat.id}', event)" title="تعديل">✏️</button><button class="mini-icon-btn" onclick="deleteCategory('${cat.id}', event)" title="حذف">🗑️</button></div>` : ''}<div class="cat-icon">${cat.icon}</div><div class="cat-name">${escapeHtml(cat.name)}</div><div style="color:var(--muted); font-size:13px; margin-top:6px;">${catDone} / ${catFiles.length} منجز</div><div class="cat-mini-prog"><div class="cat-mini-fill" style="width:${catPct}%"></div></div></div>`;
    });
    html += `</div>`;
    c.innerHTML = html;
  } else {
    let files = lib.files;
    let title = '';
    if (showFavorites) {
      files = files.filter(f => favs.includes(f.id));
      title = '⭐ الدروس المفضلة';
    } else {
      const cat = lib.categories.find(x => x.id === currentCatId);
      if (!cat) { currentCatId = null; render(); return; }
      files = files.filter(f => f.catId === currentCatId);
      title = `${cat.icon} ${cat.name}`;
    }
    renderFilesList(c, applyQuickFilters(files), title, showFavorites);
  }
}

function renderFilesList(container, files, title, showCatBadge) {
  const ordered = [...files].sort((a, b) => (a.added || 0) - (b.added || 0));
  currentOrderedList = ordered;
  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;"><button class="btn ghost small" onclick="goHome()">← الرئيسية</button><h2 style="margin:0; font-size:20px;">${title} (${ordered.length})</h2></div>`;
  if (ordered.length === 0) {
    html += `<p style="text-align:center; color:var(--muted); margin-top:40px; font-size:17px;">لا توجد دروس مطابقة.</p>`;
  } else {
    html += `<div class="files-grid">`;
    ordered.forEach((f, idx) => {
      const isFav = favs.includes(f.id);
      const isDone = completed.includes(f.id);
      const cat = lib.categories.find(c => c.id === f.catId);
      let icon = 'HTML'; let iconClass = '';
      if (f.type === 'pdf') { icon = 'PDF'; iconClass = 'file-type-pdf'; }
      if (f.type === 'image') { icon = 'IMG'; iconClass = 'file-type-img'; }
      if (f.type === 'youtube') { icon = 'VID'; iconClass = 'file-type-vid'; }
      if (f.type === 'mp4') { icon = 'MP4'; iconClass = 'file-type-mp4'; }
      const noteHtml = f.note ? `<div class="lesson-tip-box"><span class="lesson-tip-label">💡 ملاحظة:</span>${escapeHtml(f.note)}</div>` : '';
      const tagsHtml = (f.tags && f.tags.length) ? `<div class="file-tags">${f.tags.map(t => `<span class="tag-pill">#${escapeHtml(t)}</span>`).join('')}</div>` : '';
      const linksHtml = buildExtLinksHtml(f.links);
      const sizeBadge = f.sizeKb ? `<span class="cat-badge">${f.sizeKb >= 1024 ? (f.sizeKb / 1024).toFixed(1) + ' MB' : f.sizeKb + ' KB'}</span>` : '';
      html += `<div class="file-card ${isDone ? 'completed' : ''}" onclick="openViewer('${f.id}')">
        <div class="file-header"><div class="file-badges"><span class="cat-badge">#${idx + 1}</span><div class="file-icon ${iconClass}">${icon}</div>${sizeBadge}${showCatBadge && cat ? `<span class="cat-badge">${cat.icon} ${escapeHtml(cat.name)}</span>` : ''}${isDone ? `<span class="done-badge">✓ منجز</span>` : ''}</div><button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${f.id}', event)">${isFav ? '★' : '☆'}</button></div>
        <div><h3 class="file-title">${escapeHtml(f.title)}</h3>${noteHtml}${linksHtml}${tagsHtml}<div class="file-date">${new Date(f.added).toLocaleDateString('ar-IQ')}</div></div>
        ${isAdmin ? `<div class="file-actions"><button class="btn ghost small" onclick="editFile('${f.id}', event)">تعديل</button><button class="btn ghost small" style="color:var(--danger); border-color:var(--danger)" onclick="deleteFile('${f.id}', event)">حذف</button></div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}

function updateNavButtons() {
  const prevBtn = $('prevLessonBtn');
  const nextBtn = $('nextLessonBtn');
  const counterEl = $('lessonCounter');
  if (!currentViewerFile || currentOrderedList.length === 0) {
    prevBtn.disabled = true; nextBtn.disabled = true; counterEl.textContent = '0 / 0';
    return;
  }
  const idx = currentOrderedList.findIndex(x => x.id === currentViewerFile.id);
  counterEl.textContent = `${idx + 1} / ${currentOrderedList.length}`;
  prevBtn.disabled = idx <= 0;
  nextBtn.disabled = idx < 0 || idx >= currentOrderedList.length - 1;
}
function stepLesson(delta) {
  if (!currentViewerFile || !currentOrderedList.length) return;
  const idx = currentOrderedList.findIndex(x => x.id === currentViewerFile.id);
  const nextItem = currentOrderedList[idx + delta];
  if (nextItem) openViewer(nextItem.id);
}

async function openViewer(id) {
  const f = lib.files.find(x => x.id === id);
  if (!f) return;
  if (!currentOrderedList.some(x => x.id === id)) {
    currentOrderedList = lib.files.filter(x => x.catId === f.catId).sort((a, b) => (a.added || 0) - (b.added || 0));
  }

  let fileContent = f.content;
  if (!fileContent && f.idbStored) {
    fileContent = await getLargeFileContent(f.id);
    if (fileContent) f.content = fileContent;
  }

  currentViewerFile = { ...f, content: fileContent || '' };
  history.replaceState(null, '', '#file=' + f.id);
  $('viewerTitle').textContent = f.title;
  updateViewerDoneBtn();
  updateNavButtons();

  const noteBanner = $('viewerNoteBanner');
  const noteText = $('viewerNoteText');
  if (f.note) { noteText.textContent = f.note; noteBanner.style.display = 'flex'; }
  else { noteBanner.style.display = 'none'; }

  const vExt = $('viewerExtLinks');
  vExt.innerHTML = (Array.isArray(f.links) && f.links.length)
    ? f.links.map(lk => {
        const meta = getLinkIcon(lk.url, lk.label);
        return `<a class="btn ghost small" style="text-decoration:none;" href="${escapeHtml(normalizeUrl(lk.url))}" target="_blank" rel="noopener noreferrer">${meta.icon} ${escapeHtml(lk.label || 'رابط')}</a>`;
      }).join('')
    : '';

  const body = $('viewerBody');
  const codeBtn = $('codeToggleBtn');
  const dlBtn = $('downloadBtn');
  codeBtn.style.display = 'none';
  dlBtn.style.display = 'none';
  body.innerHTML = '';

  if (!fileContent && ['html', 'pdf'].includes(f.type)) {
    body.innerHTML = `<div style="display:flex;height:100%;align-items:center;justify-content:center;padding:24px;text-align:center;color:#0f172a;"><div><h3>الملف الكبير محفوظ على جهازك الأصلي فقط</h3><p>إذا فتحت المنصة من متصفح أو جهاز آخر، أعد رفع الملف مرة واحدة ليُخزن في IndexedDB على هذا الجهاز.</p></div></div>`;
    document.body.classList.add('viewing');
    return;
  }

  if (f.type === 'html') {
    const ifr = document.createElement('iframe');
    ifr.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
    ifr.srcdoc = fileContent;
    body.appendChild(ifr);
    codeBtn.style.display = 'inline-flex';
    dlBtn.style.display = 'inline-flex';
    codeBtn.textContent = 'الكود';
    codeBtn.onclick = () => {
      if (body.querySelector('iframe')) {
        body.innerHTML = `<pre>${escapeHtml(fileContent)}</pre>`;
        codeBtn.textContent = 'الصفحة';
      } else {
        body.innerHTML = '';
        const newIfr = document.createElement('iframe');
        newIfr.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
        newIfr.srcdoc = fileContent;
        body.appendChild(newIfr);
        codeBtn.textContent = 'الكود';
      }
    };
  } else if (f.type === 'pdf') {
    body.innerHTML = `<iframe src="data:application/pdf;base64,${fileContent}"></iframe>`;
    dlBtn.style.display = 'inline-flex';
  } else if (f.type === 'image') {
    body.innerHTML = `<img src="${fileContent}">`;
  } else if (f.type === 'youtube') {
    let vid = fileContent.split('v=')[1] || fileContent.split('/').pop();
    if (vid.includes('&')) vid = vid.split('&')[0];
    body.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;
  } else if (f.type === 'mp4') {
    body.innerHTML = `<video src="${fileContent}" controls autoplay></video>`;
  }
  document.body.classList.add('viewing');
}

function toggleFullscreen() {
  const v = $('viewer');
  if (!document.fullscreenElement) v.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function downloadFile() {
  if (!currentViewerFile || !currentViewerFile.content) return;
  let blob, filename;
  if (currentViewerFile.type === 'html') {
    blob = new Blob([currentViewerFile.content], { type: 'text/html;charset=utf-8' });
    filename = currentViewerFile.title.replace(/[\/\\?%*:|"<>]/g, '-') + '.html';
  } else if (currentViewerFile.type === 'pdf') {
    const byteCharacters = atob(currentViewerFile.content);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
    blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
    filename = currentViewerFile.title + '.pdf';
  }
  if (blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('جاري تحميل الملف...');
  }
}

function closeViewer() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.body.classList.remove('viewing');
  $('viewerBody').innerHTML = '';
  currentViewerFile = null;
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function escapeHtml(unsafe) {
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

}

const dropZone = $('dropZone');
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));

function handleFileSelect(file) {
  if (!file) return;
  if (file.size > MAX_LARGE_FILE_BYTES) {
    $('errorMsg').textContent = 'حجم الملف أكبر من الحد المسموح (25 MB)';
    return;
  }
  $('errorMsg').textContent = '';
  pendingFileData = file;
  const sizeLabel = file.size >= 1024 * 1024
    ? (file.size / (1024 * 1024)).toFixed(2) + ' MB'
    : Math.round(file.size / 1024) + ' KB';
  $('fileNameDisplay').textContent = `${file.name} (${sizeLabel})`;
  if (!$('fileTitle').value) $('fileTitle').value = file.name.replace(/\.[^/.]+$/, "");
  saveFormDraft();
}

async function saveFile() {
  const type = $('fileType').value;
  const catId = $('catSelect').value;
  const title = $('fileTitle').value.trim();
  const note = $('fileNote').value.trim();
  const rawTags = $('fileTags').value;
  const tags = rawTags ? rawTags.split(',').map(t => t.trim()).filter(Boolean) : [];
  const links = collectLinksFromForm();
  if (!title) { $('errorMsg').textContent = 'اكتب اسم المحتوى'; return; }

  const finalizeRecord = async (record) => {
    const wasEditing = Boolean(editingFileId);
    if (editingFileId) {
      lib.files = lib.files.map(f => f.id === editingFileId ? record : f);
    } else {
      lib.files.push(record);
      clearFormDraft();
    }
    await saveData();
    closeModal();
    render();
    showToast(wasEditing ? 'تم التعديل بنجاح' : 'تم حفظ الملف بنجاح ✅');
  };

  if (['image', 'youtube', 'mp4'].includes(type)) {
    const url = $('urlInput').value.trim();
    if (!url) { $('errorMsg').textContent = 'ضع الرابط'; return; }
    const existing = editingFileId ? lib.files.find(f => f.id === editingFileId) : null;
    await finalizeRecord({
      id: existing ? existing.id : 'f' + Date.now(),
      type, catId, title, note, tags, links,
      content: url,
      added: existing ? existing.added : Date.now()
    });
    return;
  }

  if (!pendingFileData) {
    if (editingFileId) {
      const existing = lib.files.find(f => f.id === editingFileId);
      await finalizeRecord({ ...existing, type, catId, title, note, tags, links });
      return;
    }
    $('errorMsg').textContent = 'اختر الملف أولاً';
    return;
  }

  if (pendingFileData.size > MAX_LARGE_FILE_BYTES) {
    $('errorMsg').textContent = 'حجم الملف كبير جداً (الحد الأقصى 25 ميجابايت)';
    return;
  }

  const fileId = editingFileId || ('f' + Date.now());
  const existing = editingFileId ? lib.files.find(f => f.id === editingFileId) : null;
  const sizeKb = Math.max(1, Math.round(pendingFileData.size / 1024));
  const isLarge = pendingFileData.size > LARGE_FILE_THRESHOLD;

  const reader = new FileReader();
  reader.onerror = () => { $('errorMsg').textContent = 'تعذر قراءة الملف من الجهاز'; };
  reader.onload = async (e) => {
    const res = e.target.result;
    const processedContent = type === 'html' ? res : String(res).split(',')[1];
    try {
      if (isLarge) {
        await saveLargeFileContent(fileId, type, processedContent);
        await finalizeRecord({
          id: fileId,
          type, catId, title, note, tags, links,
          sizeKb,
          idbStored: true,
          content: processedContent,
          added: existing ? existing.added : Date.now()
        });
      } else {
        await deleteLargeFileContent(fileId);
        await finalizeRecord({
          id: fileId,
          type, catId, title, note, tags, links,
          sizeKb,
          idbStored: false,
          content: processedContent,
          added: existing ? existing.added : Date.now()
        });
      }
    } catch (err) {
      $('errorMsg').textContent = 'حدث خطأ أثناء حفظ الملف الكبير محلياً';
    }
  };

  if (type === 'html') reader.readAsText(pendingFileData);
  else reader.readAsDataURL(pendingFileData);
}

function closeModal() {
  document.body.classList.remove('sheet-open');
  editingFileId = null;
  editingCatId = null;
  pendingFileData = null;
  $('errorMsg').textContent = '';
}

function goHome() {
  currentCatId = null;
  showFavorites = false;
  activeTypeFilter = 'all';
  activeTagFilter = '';
  $('searchInput').value = '';
  saveUiState();
  render();
}

async function deleteFile(id, event) {
  event.stopPropagation();
  if (!confirm('حذف هذا الدرس نهائياً؟')) return;
  lib.files = lib.files.filter(f => f.id !== id);
  favs = favs.filter(x => x !== id);
  completed = completed.filter(x => x !== id);
  writeJson('favs', favs);
  writeJson('completed', completed);
  await deleteLargeFileContent(id);
  await saveData();
  render();
  showToast('تم حذف الدرس');
}

firebase.auth().onAuthStateChanged(user => {
  isAdmin = Boolean(user);
  $('adminBtn').textContent = isAdmin ? '🔓' : '🔒';
  render();
});

window.addEventListener('hashchange', checkUrlHash);

loadData();
</script>
</body>
</html>
