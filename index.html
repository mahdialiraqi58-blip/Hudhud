<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدهد - المنصة التعليمية الذكية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link id="dynamicAppleIcon" rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3750/3750079.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

:root {
  --bg: #f4f7fb; --surface: rgba(255, 255, 255, 0.88); --surface-solid: #ffffff;
  --ink: #0f172a; --muted: #64748b; --accent: #4f46e5; --accent-hover: #4338ca;
  --accent-ink: #ffffff; --tint: #e0e7ff; --line: rgba(15, 23, 42, 0.08);
  --danger: #ef4444; --success: #10b981; --warn: #f59e0b; --star: #fbbf24;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04); --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.16); --radius: 22px;
  --base-font: 16px;
}
[data-theme="dark"] {
  --bg: #070d19; --surface: rgba(17, 26, 46, 0.86); --surface-solid: #111a2e;
  --ink: #f8fafc; --muted: #94a3b8; --accent: #818cf8; --accent-hover: #6366f1;
  --accent-ink: #070d19; --tint: rgba(129, 140, 248, 0.16); --line: rgba(248, 250, 252, 0.09);
  --danger: #f87171; --success: #34d399; --warn: #fbbf24; --star: #fbbf24;
}
[data-theme="comfort"] {
  --bg: #f5efe4; --surface: rgba(252, 248, 240, 0.92); --surface-solid: #fcf8f0;
  --ink: #2c241b; --muted: #6e5f4f; --accent: #b45309; --accent-hover: #92400e;
  --accent-ink: #ffffff; --tint: rgba(180, 83, 9, 0.14); --line: rgba(44, 36, 27, 0.10);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: var(--base-font); }
html, body { margin: 0; min-height: 100%; scroll-behavior: smooth; }
body {
  background-color: var(--bg); color: var(--ink);
  font: 1rem/1.65 "IBM Plex Sans Arabic", system-ui, sans-serif;
  background-image: radial-gradient(circle at 12% 0%, var(--tint), transparent 38%), radial-gradient(circle at 90% 10%, rgba(139, 92, 246, 0.10), transparent 35%);
  -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
  touch-action: manipulation;
}
body.viewing, body.sheet-open { overflow: hidden; }

#scrollProgressBar {
  position: fixed; top: 0; right: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  z-index: 9998; transition: width 0.1s ease-out;
}

.smart-banner {
  position: sticky; top: 0; z-index: 90; padding: 9px 16px;
  font-size: 13px; font-weight: 700; text-align: center;
  display: none; align-items: center; justify-content: center; gap: 10px;
  backdrop-filter: blur(12px);
}
.smart-banner.offline { background: rgba(239, 68, 68, 0.92); color: #fff; display: flex; }
.smart-banner.online-back { background: rgba(16, 185, 129, 0.94); color: #fff; display: flex; }

#preloader { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
.preloader-icon { display: inline-flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(145deg, #1e1b4b, #312e81); box-shadow: var(--shadow-lg); animation: fly 1.5s infinite ease-in-out; }
@keyframes fly { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(6deg); } 100% { transform: translateY(0) rotate(0deg); } }
#preloader.hidden { opacity: 0; pointer-events: none; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 20px 95px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 24px; padding: 12px 18px; box-shadow: var(--shadow-sm); }
.logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 17px; background: linear-gradient(145deg, #1e1b4b, #312e81); border: 1px solid rgba(251, 191, 36, 0.35); box-shadow: var(--shadow-md); transition: transform 0.25s ease; overflow: hidden; }
.logo-area:hover .logo-icon { transform: rotate(-5deg) scale(1.05); }
.hoopoe-svg { width: 40px; height: 40px; display: block; }
.preloader-hoopoe-svg { width: 64px; height: 64px; display: block; }
.brand-sub { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-top: -2px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.timer-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.timer-time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--accent); min-width: 48px; text-align: center; }
.timer-mode { font-size: 11px; color: var(--muted); background: var(--surface); padding: 2px 7px; border-radius: 8px; border: 1px solid var(--line); }
.timer-btn { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
.timer-btn:hover { border-color: var(--accent); color: var(--accent); }
.timer-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.icon-btn { background: var(--bg); border: 1px solid var(--line); color: var(--ink); width: 40px; height: 40px; border-radius: 13px; cursor: pointer; font-size: 16px; font-weight: 700; display: grid; place-items: center; transition: 0.2s; }
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

.install-app-btn {
  background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff;
  border: 0; border-radius: 13px; padding: 8px 13px; font: inherit;
  font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; box-shadow: var(--shadow-sm); transition: 0.2s;
}
.install-app-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

.hub-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.hub-tab { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: 14px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
.hub-tab:hover { border-color: var(--accent); transform: translateY(-1px); }
.hub-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: center; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
.stat-card:hover { transform: translateY(-2px); }
.stat-val { font-size: 23px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }

.progress-wrap { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); }
.progress-bar-bg { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 99px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.progress-text { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }

.toolbar { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.search-box { position: relative; flex: 1; min-width: 240px; }
.search-box input { width: 100%; padding: 13px 42px 13px 72px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px); transition: 0.2s; }
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--tint); }
.search-box::before { content: '🔍'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 17px; opacity: 0.55; }
.kbd-hint { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); background: var(--bg); padding: 3px 7px; border-radius: 7px; border: 1px solid var(--line); pointer-events: none; }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
.filter-chip { background: var(--surface); border: 1px solid var(--line); color: var(--muted); padding: 6px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
.filter-chip:hover { border-color: var(--accent); color: var(--ink); }
.filter-chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filter-sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }

.btn { border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--accent-hover); transform: translateY(-1.5px); box-shadow: var(--shadow-md); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.success { background: var(--success); color: #fff; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 11px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.cat-card { position: relative; background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow-sm); animation: fadeIn 0.4s ease forwards; opacity: 0; }
@keyframes fadeIn { to { opacity: 1; } }
.cat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--accent); }
.cat-icon { font-size: 40px; margin-bottom: 10px; transition: transform 0.25s ease; }
.cat-card:hover .cat-icon { transform: scale(1.08); }
.cat-name { font-weight: 700; font-size: 17px; }
.cat-mini-prog { height: 5px; background: var(--line); border-radius: 5px; margin-top: 12px; overflow: hidden; }
.cat-mini-fill { height: 100%; background: var(--success); transition: width 0.3s; }
.cat-admin-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
.mini-icon-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: 28px; height: 28px; font-size: 12px; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
.mini-icon-btn:hover { border-color: var(--accent); transform: scale(1.1); }

.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.file-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.25s ease; animation: fadeIn 0.4s ease forwards; opacity: 0; }
.file-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.file-card.completed { border-right: 4px solid var(--success); }
.file-header { display: flex; justify-content: space-between; align-items: center; }
.file-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.file-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--tint); color: var(--accent); flex-shrink: 0; }
.file-type-pdf { color: #dc2626; background: rgba(239, 68, 68, 0.14); }
.file-type-img { color: #059669; background: rgba(16, 185, 129, 0.14); }
.file-type-vid { color: #d97706; background: rgba(245, 158, 11, 0.16); }
.file-type-mp4 { color: #7c3aed; background: rgba(139, 92, 246, 0.16); }
.cat-badge { font-size: 11px; background: var(--bg); border: 1px solid var(--line); padding: 3px 8px; border-radius: 8px; color: var(--muted); font-weight: 600; }
.done-badge { font-size: 11px; background: rgba(16, 185, 129, 0.16); color: var(--success); padding: 3px 8px; border-radius: 8px; font-weight: 700; }
.lesson-tip-box { background: rgba(79, 70, 229, 0.07); border-right: 3px solid var(--accent); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; color: var(--ink); margin-top: 8px; }
.lesson-tip-label { font-weight: 700; color: var(--accent); margin-left: 4px; }
.ext-links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.ext-link-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; text-decoration: none; padding: 5px 10px; border-radius: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); transition: 0.2s; }
.ext-link-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.ext-link-chip.yt { color: #dc2626; border-color: rgba(220, 38, 38, 0.25); background: rgba(220, 38, 38, 0.07); }
.star-btn { background: none; border: 0; font-size: 24px; cursor: pointer; color: var(--muted); transition: 0.2s; line-height: 1; padding: 0; }
.star-btn.active { color: var(--star); transform: scale(1.1); }
.file-title { font-weight: 700; font-size: 17px; margin: 0; }
.file-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-pill { font-size: 11px; color: var(--accent); background: var(--tint); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.file-date { font-size: 12px; color: var(--muted); margin-top: 8px; }
.file-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.file-actions button { flex: 1; }

.panel-card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }

/* تنسيق الاختبارات غير المحدودة */
.quiz-builder-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 16px;
  align-items: end;
}
.quiz-meta-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 700;
}
.quiz-option-btn {
  width: 100%;
  text-align: right;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 11px 14px;
  border-radius: 12px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.quiz-option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateX(-2px); }
.quiz-option-btn.correct { background: rgba(16, 185, 129, 0.16); border-color: var(--success); color: var(--success); }
.quiz-option-btn.wrong { background: rgba(239, 68, 68, 0.14); border-color: var(--danger); color: var(--danger); }
.quiz-result-box {
  margin-top: 18px;
  background: linear-gradient(135deg, var(--tint), transparent);
  border: 1px solid var(--accent);
  border-radius: 18px;
  padding: 18px;
  text-align: center;
}
.quiz-history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.quiz-history-chip {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 700;
}
.remove-link-btn { background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: bold; }

.viewer { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; flex-direction: column; }
.viewing .viewer { display: flex; }
.vbar { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--surface-solid); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; gap: 8px; }
.vnav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.close-x-btn { background: rgba(239, 68, 68, 0.14); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.35); font-weight: 800; }
.close-x-btn:hover { background: var(--danger); color: #fff; }
.lesson-counter { font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--tint); padding: 5px 10px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.vactions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vnote-banner { background: var(--surface-solid); border-bottom: 1px solid var(--line); padding: 8px 18px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.vbody { flex: 1; position: relative; background: #ffffff; }
iframe, img, video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
pre { position: absolute; inset: 0; margin: 0; padding: 20px; background: #1e1e1e; color: #d4d4d4; overflow: auto; direction: ltr; text-align: left; font: 14px/1.6 monospace; }

.scrim { position: fixed; inset: 0; z-index: 300; background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
.sheet-open .scrim { display: flex; }
.sheet { width: 100%; max-width: 540px; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 15px; margin: 20px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
.sheet-open .sheet { transform: translateY(0); opacity: 1; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
select, input[type="text"], input[type="password"], input[type="email"], input[type="url"], textarea { padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; transition: 0.2s; width: 100%; }
textarea { resize: vertical; min-height: 68px; }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }

.links-builder { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.links-builder-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink); }
.link-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 6px; align-items: center; }
@media (max-width: 480px) { .link-row { grid-template-columns: 1fr; } }
.link-row input { padding: 9px 10px; font-size: 13px; }

.drop-zone { border: 2px dashed var(--line); border-radius: 16px; padding: 22px; text-align: center; cursor: pointer; transition: 0.2s; background: var(--bg); }
.drop-zone.dragover { border-color: var(--accent); background: var(--tint); }
.drop-zone p { margin: 0; color: var(--muted); font-size: 13.5px; }

#backToTopBtn {
  position: fixed; bottom: 24px; left: 24px; z-index: 50;
  width: 46px; height: 46px; border-radius: 15px; border: 1px solid var(--line);
  background: var(--accent); color: #fff; font-size: 20px; font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow-md); display: grid; place-items: center;
  opacity: 0; pointer-events: none; transform: translateY(15px); transition: 0.25s ease;
}
#backToTopBtn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
#backToTopBtn:hover { background: var(--accent-hover); transform: translateY(-2px); }

#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--bg); padding: 12px 24px; border-radius: 99px; font-weight: 600; opacity: 0; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 400; box-shadow: var(--shadow-lg); text-align: center; max-width: 90vw; }
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.success { background: var(--success); color: #fff; }

  function mountHoopoeIcons() {
    const masterSvg = document.getElementById('hoopoeVectorMaster');
    if (!masterSvg) return;

    const headerSvg = masterSvg.cloneNode(true);
    headerSvg.removeAttribute('id');
    headerSvg.removeAttribute('style');
    headerSvg.removeAttribute('aria-hidden');
    headerSvg.classList.add('hoopoe-svg');
    const headerBox = document.getElementById('headerHoopoeBox');
    if (headerBox) { headerBox.innerHTML = ''; headerBox.appendChild(headerSvg); }

    const preloaderSvg = masterSvg.cloneNode(true);
    preloaderSvg.removeAttribute('id');
    preloaderSvg.removeAttribute('style');
    preloaderSvg.removeAttribute('aria-hidden');
    preloaderSvg.classList.add('preloader-hoopoe-svg');
    const preloaderBox = document.getElementById('preloaderHoopoeBox');
    if (preloaderBox) { preloaderBox.innerHTML = ''; preloaderBox.appendChild(preloaderSvg); }

    try {
      const exportSvg = masterSvg.cloneNode(true);
      exportSvg.setAttribute('width', '512');
      exportSvg.setAttribute('height', '512');
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(exportSvg);
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
        bgGrad.addColorStop(0, '#1e1b4b');
        bgGrad.addColorStop(1, '#312e81');
        ctx.fillStyle = bgGrad;
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 112);
        ctx.fill();
        ctx.drawImage(img, 36, 36, 440, 440);
        const pngDataUrl = canvas.toDataURL('image/png');
        const appleIcon = document.getElementById('dynamicAppleIcon');
        if (appleIcon) appleIcon.href = pngDataUrl;
        URL.revokeObjectURL(url);
      };
      img.src = url;
    } catch (e) {}
  }
  mountHoopoeIcons();

  let audioCtxInstance = null;
  function getAudioContext() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    if (!audioCtxInstance) audioCtxInstance = new AudioCtx();
    if (audioCtxInstance.state === 'suspended') {
      audioCtxInstance.resume().catch(() => {});
    }
    return audioCtxInstance;
  }

  function playGentleChime(completedMode = 'study') {
    const ctx = getAudioContext();
    if (!ctx) return;
    const notes = completedMode === 'study'
      ? [523.25, 659.25, 783.99, 1046.50]
      : [659.25, 587.33, 523.25];
    const now = ctx.currentTime;

    notes.forEach((freq, i) => {
      const startTime = now + i * 0.22;
      const duration = 0.75;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.14, startTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    });
  }

  /* مولد الاختبارات غير المحدودة */
  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function buildLessonQuestions(catId) {
    const pool = catId === 'all'
      ? lib.files
      : lib.files.filter(f => f.catId === catId);

    const allTitles = lib.files.map(f => f.title).filter(Boolean);
    const distractors = [
      'مقرر الجغرافيا الاقتصادية والسياحية',
      'قوانين الوراثة في علم الأحياء',
      'تاريخ العمارة الإغريقية القديمة',
      'تحليل التربة والأسمدة العضوية'
    ];

    const generated = [];
    pool.forEach((f, i) => {
      const cat = lib.categories.find(c => c.id === f.catId);
      const catName = cat ? cat.name : 'المقرر الدراسي';
      const otherTitles = allTitles.filter(t => t !== f.title);
      const wrongPool = shuffleArray([...otherTitles, ...distractors]).slice(0, 2);

      if (i % 2 === 0) {
        const rawOpts = [
          { text: catName, ok: true },
          { text: wrongPool[0] || 'قسم خارج المنهج', ok: false },
          { text: wrongPool[1] || 'مادة غير مقررة', ok: false }
        ];
        const shuffledOpts = shuffleArray(rawOpts);
        generated.push({
          question: `ضمن أي قسم يُصنّف درس «${f.title}»؟`,
          options: shuffledOpts.map(o => o.text),
          correct: shuffledOpts.findIndex(o => o.ok),
          explain: `الدرس «${f.title}» تابع لقسم «${catName}».`
        });
      } else {
        const tipText = f.note && f.note.trim()
          ? f.note.trim()
          : `مراجعة الدرس «${f.title}» ضمن قسم «${catName}» والاستعداد للامتحان التمهيدي.`;
        const rawOpts = [
          { text: tipText, ok: true },
          { text: 'إهمال مراجعة الدرس تماماً لعدم أهميته', ok: false },
          { text: 'حذف الدرس من الخطة الدراسية', ok: false }
        ];
        const shuffledOpts = shuffleArray(rawOpts);
        generated.push({
          question: `ما الفكرة أو التوجيه المرتبط بدرس «${f.title}»؟`,
          options: shuffledOpts.map(o => o.text),
          correct: shuffledOpts.findIndex(o => o.ok),
          explain: tipText
        });
      }
    });

    return generated;
  }

  function generateUnlimitedQuiz(notify = true) {
    quizSettings.seed = (quizSettings.seed || 1) + 1;
    localStorage.setItem('hudhud_quiz_settings', JSON.stringify(quizSettings));

    const bankFiltered = quizSettings.catId === 'all'
      ? QUESTION_BANK
      : QUESTION_BANK.filter(q => q.catHint === quizSettings.catId);

    const bankShuffled = shuffleArray(bankFiltered.length ? bankFiltered : QUESTION_BANK).map(q => {
      const taggedOpts = q.options.map((text, idx) => ({ text, ok: idx === q.correct }));
      const shuf = shuffleArray(taggedOpts);
      return {
        question: q.question,
        options: shuf.map(o => o.text),
        correct: shuf.findIndex(o => o.ok),
        explain: q.explain
      };
    });

    const lessonQs = buildLessonQuestions(quizSettings.catId);
    const combined = shuffleArray([...bankShuffled, ...lessonQs]);

    const targetCount = Math.max(3, Math.min(20, Number(quizSettings.count) || 10));
    const list = [];
    if (combined.length > 0) {
      while (list.length < targetCount) {
        const batch = shuffleArray(combined);
        for (const item of batch) {
          if (list.length >= targetCount) break;
          list.push({ ...item, qNum: list.length + 1 });
        }
      }
    }

    currentQuizQuestions = list;
    quizAnswers = {};
    quizRecordedCurrentRun = false;
    if (notify) showToast(`تم توليد اختبار جديد رقم #${quizSettings.seed} (${list.length} أسئلة) ⚡`);
    if (activeHubTab === 'quiz') renderSmartHub();
  }

  function answerQuiz(qIdx, chosenIdx) {
    const q = currentQuizQuestions[qIdx];
    if (!q) return;
    quizAnswers[qIdx] = chosenIdx;

    const box = document.getElementById('qOpts_' + qIdx);
    const expEl = document.getElementById('qExplain_' + qIdx);
    if (box) {
      const btns = box.querySelectorAll('.quiz-option-btn');
      btns.forEach((b, i) => {
        b.classList.remove('correct', 'wrong');
        if (i === q.correct) b.classList.add('correct');
        else if (i === chosenIdx && chosenIdx !== q.correct) b.classList.add('wrong');
      });
    }
    if (expEl) {
      expEl.style.display = 'block';
      expEl.textContent = (chosenIdx === q.correct ? '✅ إجابة صحيحة: ' : '❌ راجع التوضيح: ') + q.explain;
    }

    const answeredCount = Object.keys(quizAnswers).length;
    const scoreCount = Object.entries(quizAnswers).filter(([idx, val]) => currentQuizQuestions[Number(idx)] && currentQuizQuestions[Number(idx)].correct === val).length;
    const liveScoreEl = document.getElementById('quizLiveScore');
    if (liveScoreEl) liveScoreEl.textContent = `المجاب: ${answeredCount} / ${currentQuizQuestions.length} | الدرجة: ${scoreCount}`;

    if (answeredCount === currentQuizQuestions.length && !quizRecordedCurrentRun) {
      quizRecordedCurrentRun = true;
      const pct = Math.round((scoreCount / currentQuizQuestions.length) * 100);
      quizHistory.unshift({
        run: quizSettings.seed,
        score: scoreCount,
        total: currentQuizQuestions.length,
        pct,
        time: new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' })
      });
      quizHistory = quizHistory.slice(0, 8);
      localStorage.setItem('hudhud_quiz_history', JSON.stringify(quizHistory));
      if (pct >= 70) {
        confetti({ particleCount: 80, spread: 65, origin: { y: 0.65 } });
      }
      renderSmartHub();
    }
  }

  function exportBackupJson() {

      lib,

      favs,
      completed
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hudhud-backup-2026-11-21.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('تم تصدير النسخة الاحتياطية بنجاح 📤');
  }

  function importBackupJson(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.lib && Array.isArray(data.lib.files)) {
          lib = data.lib;
          localStorage.setItem('hudhud_lib_cache', JSON.stringify(lib));
        }
        if (Array.isArray(data.quizHistory)) {
          quizHistory = data.quizHistory;
          localStorage.setItem('hudhud_quiz_history', JSON.stringify(quizHistory));
        }
        if (Array.isArray(data.favs)) {
          favs = data.favs;
          localStorage.setItem('favs', JSON.stringify(favs));
        }
        if (Array.isArray(data.completed)) {
          completed = data.completed;
          localStorage.setItem('completed', JSON.stringify(completed));
        }
        showToast('تم استيراد النسخة الاحتياطية وتحديث الواجهة 📥');
        render();
        renderSmartHub();
      } catch (err) {
        showToast('ملف النسخة الاحتياطية غير صالح', 'error');
      }
    };
    reader.readAsText(file);
  }

    try {
      const r = await fetch(FIREBASE_URL + 'data.json');
      const data = await r.json();
      if(data) {
        lib.files = data.files || [];

  function updateNavButtons() {
    const prevBtn = document.getElementById('prevLessonBtn');

  function stepLesson(delta) {
    if (!currentViewerFile || !currentOrderedList.length) return;
    const idx = currentOrderedList.findIndex(x => x.id === currentViewerFile.id);
    const nextItem = currentOrderedList[idx + delta];

  function openViewer(id) {
    const f = lib.files.find(x => x.id === id); if(!f) return;
    if (!currentOrderedList.some(x => x.id === id)) {
      currentOrderedList = lib.files.filter(x => x.catId === f.catId).sort((a,b) => (a.added || 0) - (b.added || 0));

    vExt.innerHTML = (Array.isArray(f.links) && f.links.length) ? f.links.map(lk => { const meta = getLinkIcon(lk.url, lk.label); return `<a class="btn ghost small" style="text-decoration:none;" href="${escapeHtml(normalizeUrl(lk.url))}" target="_blank" rel="noopener noreferrer">${meta.icon} ${escapeHtml(lk.label || 'رابط')}</a>`; }).join('') : '';

    } else if (f.type === 'pdf') { body.innerHTML = `<iframe src="data:application/pdf;base64,${f.content}"></iframe>`; dlBtn.style.display = 'inline-flex'; } 
    else if (f.type === 'image') { body.innerHTML = `<img src="${f.content}">`; } 
    else if (f.type === 'youtube') { let vid = f.content.split('v=')[1] || f.content.split('/').pop(); if(vid.includes('&')) vid = vid.split('&')[0]; body.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`; }

    else if (currentViewerFile.type === 'pdf') { const byteCharacters = atob(currentViewerFile.content); const byteNumbers = new Array(byteCharacters.length); for (let i = 0; i < byteCharacters.length; i++) { byteNumbers[i] = byteCharacters.charCodeAt(i); } blob = new Blob([new Uint8Array(byteNumbers)], {type: 'application/pdf'}); filename = currentViewerFile.title + '.pdf'; }
    if(blob) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast('جاري تحميل الملف...'); }

  function handleAdminBtn() {
    if (isAdmin) { firebase.auth().signOut().then(() => { isAdmin = false; render(); showToast('تم تسجيل الخروج'); }); } 
    else { hideAllModalSecs(); document.getElementById('modalTitle').textContent = 'دخول الإدارة الآمن'; document.getElementById('loginSec').style.display = 'flex'; document.getElementById('emailInput').value = ''; document.getElementById('passInput').value = ''; document.body.classList.add('sheet-open'); setTimeout(() => document.getElementById('emailInput').focus(), 100); }
  }
  function doLogin() {
    const email = document.getElementById('emailInput').value.trim(); const password = document.getElementById('passInput').value;
    if(!email || !password) return document.getElementById('errorMsg').textContent = 'أدخل البريد وكلمة المرور';
    firebase.auth().signInWithEmailAndPassword(email, password).then((userCredential) => { isAdmin = true; closeModal(); render(); showToast('مرحباً بك يا مدير'); }).catch((error) => { document.getElementById('errorMsg').textContent = 'البريد أو كلمة المرور غير صحيحة'; });
  }

  function openSettings() { hideAllModalSecs(); document.getElementById('modalTitle').textContent = 'الإعدادات'; document.getElementById('settingsSec').style.display = 'flex'; document.getElementById('newSiteName').value = lib.settings.siteName || 'هدهد'; document.body.classList.add('sheet-open'); }
  function saveSettings() { lib.settings.siteName = document.getElementById('newSiteName').value.trim() || 'هدهد'; saveData().then(() => { document.getElementById('siteTitle').textContent = lib.settings.siteName; closeModal(); showToast('تم حفظ الإعدادات'); }); }

  function openAddModal() {
    editingFileId = null; editingCatId = null; pendingFileData = null; hideAllModalSecs();
    if (currentCatId === null) { document.getElementById('modalTitle').textContent = 'إضافة قسم جديد'; document.getElementById('newCatName').value = ''; document.getElementById('newCatIcon').value = ''; document.getElementById('catSec').style.display = 'flex'; } 
    else {
      document.getElementById('modalTitle').textContent = 'إضافة درس جديد'; document.getElementById('fileNameDisplay').textContent = 'لم يتم اختيار ملف'; document.getElementById('fileTitle').value = ''; document.getElementById('fileNote').value = ''; document.getElementById('fileTags').value = ''; document.getElementById('urlInput').value = ''; document.getElementById('linksContainer').innerHTML = ''; document.getElementById('fileType').value = 'html';
      const sel = document.getElementById('catSelect'); sel.innerHTML = ''; lib.categories.forEach(c => sel.innerHTML += `<option value="${c.id}" ${c.id===currentCatId?'selected':''}>${c.name}</option>`);
      try {
        const draft = JSON.parse(localStorage.getItem('hudhud_add_draft') || 'null');
        if (draft) {
          if (draft.type) document.getElementById('fileType').value = draft.type;
          if (draft.title) document.getElementById('fileTitle').value = draft.title;
          if (draft.note) document.getElementById('fileNote').value = draft.note;
          if (draft.tags) document.getElementById('fileTags').value = draft.tags;
          if (draft.url) document.getElementById('urlInput').value = draft.url;
        }
      } catch (e) {}
      toggleFileInput(); document.getElementById('addSec').style.display = 'flex';
    }
    document.body.classList.add('sheet-open');
  }

  function editCategory(id, event) {
    event.stopPropagation(); const cat = lib.categories.find(c => c.id === id); if (!cat) return;
    editingCatId = id; hideAllModalSecs(); document.getElementById('modalTitle').textContent = 'تعديل القسم'; document.getElementById('newCatName').value = cat.name; document.getElementById('newCatIcon').value = cat.icon; document.getElementById('catSec').style.display = 'flex'; document.body.classList.add('sheet-open');
  }
  function saveCategory() {
    const name = document.getElementById('newCatName').value.trim(); const icon = document.getElementById('newCatIcon').value.trim() || '📁';
    if(!name) return document.getElementById('errorMsg').textContent = 'اكتب اسم القسم';
    if (editingCatId) { lib.categories = lib.categories.map(c => c.id === editingCatId ? {...c, name, icon} : c); } 
    else { lib.categories.push({id: 'c'+Date.now(), name, icon}); }
    saveData().then(() => { closeModal(); render(); showToast(editingCatId ? 'تم تحديث القسم' : 'تم إضافة القسم'); });
  }
  function deleteCategory(id, event) {
    event.stopPropagation(); const count = lib.files.filter(f => f.catId === id).length;
    if (count > 0) return showToast('لا يمكن حذف قسم يحتوي على ملفات', 'error');
    if (!confirm('حذف هذا القسم نهائياً؟')) return;
    lib.categories = lib.categories.filter(c => c.id !== id); saveData().then(() => { render(); showToast('تم حذف القسم'); });
  }

  function editFile(id, event) {
    event.stopPropagation(); const f = lib.files.find(x => x.id === id); if(!f) return;
    editingFileId = id; pendingFileData = null; hideAllModalSecs(); document.getElementById('modalTitle').textContent = 'تعديل الدرس'; document.getElementById('addSec').style.display = 'flex';
    document.getElementById('fileType').value = f.type; document.getElementById('fileTitle').value = f.title; document.getElementById('fileNote').value = f.note || ''; document.getElementById('fileTags').value = (f.tags || []).join(', ');
    const linksContainer = document.getElementById('linksContainer'); linksContainer.innerHTML = ''; if (Array.isArray(f.links)) { f.links.forEach(lk => addLinkRow(lk.label, lk.url)); }
    toggleFileInput();
    if (['image', 'youtube', 'mp4'].includes(f.type)) document.getElementById('urlInput').value = f.content; else document.getElementById('fileNameDisplay').textContent = 'الملف الحالي محفوظ (اختر ملف جديد للتغيير)';
    const sel = document.getElementById('catSelect'); sel.innerHTML = ''; lib.categories.forEach(c => sel.innerHTML += `<option value="${c.id}" ${c.id===f.catId?'selected':''}>${c.name}</option>`);
    document.body.classList.add('sheet-open');
  }

  function toggleFileInput() {
    const type = document.getElementById('fileType').value;
    if (['image', 'youtube', 'mp4'].includes(type)) { document.getElementById('fileUploadBox').style.display = 'none'; document.getElementById('urlInputBox').style.display = 'block'; } 
    else { document.getElementById('fileUploadBox').style.display = 'block'; document.getElementById('urlInputBox').style.display = 'none'; document.getElementById('fileInput').accept = type === 'pdf' ? '.pdf' : '.html'; }
  }

  const dropZone = document.getElementById('dropZone');
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
  ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.add('dragover')));
  ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('dragover')));
  dropZone.addEventListener('drop', e => handleFileSelect(e.dataTransfer.files[0]));

  function handleFileSelect(file) {
    if(!file) return; pendingFileData = file;
    document.getElementById('fileNameDisplay').textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB)';
    if(!document.getElementById('fileTitle').value) document.getElementById('fileTitle').value = file.name.replace(/\.[^/.]+$/, "");
    saveFormDraft();
  }

  function saveFile() {
    const type = document.getElementById('fileType').value; const catId = document.getElementById('catSelect').value; const title = document.getElementById('fileTitle').value.trim(); const note = document.getElementById('fileNote').value.trim();
    const rawTags = document.getElementById('fileTags').value; const tags = rawTags ? rawTags.split(',').map(t => t.trim()).filter(Boolean) : []; const links = collectLinksFromForm();
    if(!title) return document.getElementById('errorMsg').textContent = 'اكتب اسم المحتوى';
    const doSave = (content) => {
      if (editingFileId) { lib.files = lib.files.map(f => f.id === editingFileId ? {...f, type, catId, title, note, tags, links, content} : f); } 
      else { lib.files.push({id: 'f'+Date.now(), type, catId, title, note, tags, links, content, added: Date.now()}); clearFormDraft(); }
      saveData().then(() => { closeModal(); render(); showToast(editingFileId ? 'تم التعديل' : 'تم الحفظ'); });
    };
    if (['image', 'youtube', 'mp4'].includes(type)) {
      const url = document.getElementById('urlInput').value.trim(); if(!url) return document.getElementById('errorMsg').textContent = 'ضع الرابط'; doSave(url);
    } else {
      if (!pendingFileData) {
        if (editingFileId) { const existing = lib.files.find(f => f.id === editingFileId); doSave(existing.content); return; }
        return document.getElementById('errorMsg').textContent = 'اختر الملف أولاً';
      }
      if (pendingFileData.size > 800 * 1024) return document.getElementById('errorMsg').textContent = 'حجم الملف كبير جداً (الحد 800 كيلوبايت)';
      const reader = new FileReader();
      reader.onload = (e) => { const res = e.target.result; if (type === 'html') doSave(res); else doSave(res.split(',')[1]); };
      if(type === 'html') reader.readAsText(pendingFileData); else reader.readAsDataURL(pendingFileData);
    }
  }

  function deleteFile(id, event) {
    event.stopPropagation(); if(!confirm('هل أنت متأكد من الحذف؟')) return;
    lib.files = lib.files.filter(f => f.id !== id); saveData().then(() => { render(); showToast('تم الحذف'); });
  }

  function closeModal() { document.body.classList.remove('sheet-open'); }
  function goHome() { switchHubTab('lessons'); currentCatId = null; showFavorites = false; activeTypeFilter = 'all'; activeTagFilter = ''; document.getElementById('searchInput').value = ''; saveUiState(); render(); }

  firebase.auth().onAuthStateChanged((user) => { if (user) { isAdmin = true; render(); } else { isAdmin = false; render(); } });
  loadData();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
  }
</script>
</body>
</html>
