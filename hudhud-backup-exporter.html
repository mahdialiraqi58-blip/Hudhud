
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هدهد - النسخ الاحتياطي</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px;
  background:#f2e7df;color:#30271f;
  font-family:Arial,sans-serif;
}
main{
  max-width:600px;margin:35px auto;
  background:#fffaf3;padding:25px;
  border-radius:24px;text-align:center;
  box-shadow:0 8px 30px #0001;
}
h1{color:#b95608}
p{line-height:1.8;color:#766657}
button{
  border:0;border-radius:14px;
  padding:16px 25px;margin:8px;
  background:#b95608;color:white;
  font-size:17px;font-weight:bold;
  cursor:pointer;width:100%;
}
#status{
  margin-top:20px;padding:15px;
  background:#f3eee7;border-radius:12px;
  white-space:pre-wrap;line-height:1.8;
}
.small{font-size:13px}
</style>
</head>
<body>
<main>
  <h1>🐦 هدهد</h1>
  <h2>النسخ الاحتياطي الشامل</h2>
  <p>
    استخراج نسخة احتياطية من بيانات المنصة
    والملفات المخزنة محلياً على هذا الجهاز.
  </p>

  <button id="exportBtn">إنشاء النسخة الاحتياطية</button>

  <div id="status">جاهز لاستخراج البيانات.</div>

  <p class="small">
    الأداة تقرأ البيانات فقط ولا تحذف أو تعدل أي شيء.
    احتفظ بالملف الناتج في مكان آمن.
  </p>
</main>

<script>
const DB_NAME = "hudhud_large_files_db";

const statusBox = document.getElementById("status");
const exportBtn = document.getElementById("exportBtn");

function status(message){
  statusBox.textContent = message;
}

function bytesToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  let binary = "";
  const chunk = 0x8000;

  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode(
      ...bytes.subarray(i,Math.min(i+chunk,bytes.length))
    );
  }

  return btoa(binary);
}

async function serialize(value){
  if(value instanceof Blob){
    return {
      __type:"Blob",
      type:value.type,
      size:value.size,
      base64:bytesToBase64(await value.arrayBuffer())
    };
  }

  if(value instanceof ArrayBuffer){
    return {
      __type:"ArrayBuffer",
      base64:bytesToBase64(value)
    };
  }

  if(ArrayBuffer.isView(value)){
    return {
      __type:value.constructor.name,
      base64:bytesToBase64(
        value.buffer.slice(
          value.byteOffset,
          value.byteOffset+value.byteLength
        )
      )
    };
  }

  if(value instanceof Date){
    return {
      __type:"Date",
      value:value.toISOString()
    };
  }

  if(Array.isArray(value)){
    return Promise.all(value.map(serialize));
  }

  if(value && typeof value==="object"){
    const result={};

    for(const key of Object.keys(value)){
      result[key]=await serialize(value[key]);
    }

    return result;
  }

  return value;
}

function readLocalStorage(){
  const result={};

  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    result[key]=localStorage.getItem(key);
  }

  return result;
}

function readIndexedDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME);

    request.onerror=()=>reject(
      request.error || new Error("تعذر فتح IndexedDB")
    );

    request.onupgradeneeded=()=>{
      request.transaction.abort();
      reject(new Error("قاعدة البيانات غير موجودة على هذا النطاق"));
    };

    request.onsuccess=async()=>{
      const db=request.result;

      try{
        const output={};

        for(const storeName of Array.from(db.objectStoreNames)){
          const records=await new Promise((res,rej)=>{
            const tx=db.transaction(storeName,"readonly");
            const store=tx.objectStore(storeName);
            const req=store.getAll();

            req.onsuccess=()=>res(req.result);
            req.onerror=()=>rej(req.error);
          });

          output[storeName]=await serialize(records);
        }

        db.close();
        resolve({
          database:DB_NAME,
          stores:output
        });
      }catch(error){
        db.close();
        reject(error);
      }
    };
  });
}

function downloadJSON(data){
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="Hudhud-Full-Backup-"+Date.now()+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

exportBtn.addEventListener("click",async()=>{
  exportBtn.disabled=true;
  status("جارٍ قراءة بيانات هدهد...");

  try{
    const localData=readLocalStorage();

    status("تم جمع التخزين المحلي.\nجارٍ قراءة الملفات الكبيرة...");

    let indexedData=null;
    let indexedError=null;

    try{
      indexedData=await readIndexedDB();
    }catch(error){
      indexedError=error.message;
    }

    const backup={
      application:"Hudhud",
      backupVersion:1,
      exportedAt:new Date().toISOString(),
      origin:location.origin,
      localStorage:localData,
      indexedDB:indexedData,
      indexedDBError:indexedError,
      warning:"هذه نسخة بيانات محلية. لا تتضمن تلقائياً بيانات Firebase السحابية."
    };

    downloadJSON(backup);

    status(
      "تم تجهيز النسخة الاحتياطية.\n"+
      "مفاتيح التخزين المحلي: "+
      Object.keys(localData).length+"\n"+
      "قاعدة IndexedDB: "+
      (indexedData?"تم استخراجها":"لم يتم استخراجها")+
      (indexedError?"\nالسبب: "+indexedError:"")+
      "\n\nاحتفظ بملف JSON وأرسله للمراجعة."
    );

  }catch(error){
    status("حدث خطأ:\n"+error.message);
  }finally{
    exportBtn.disabled=false;
  }
});
</script>
</body>
</html>
